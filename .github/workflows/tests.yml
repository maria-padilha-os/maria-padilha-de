name: tests

# The contract suites in tests/ are the project's promises: the compiler never
# replaces a working file, the palette matches Material, the commands refuse
# what they say they refuse. Run all of them on Arch, because Arch is the
# desktop's floor (Lua 5.5, ImageMagick 7, the packaged colour oracle).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:latest
    steps:
      - name: Install the runtime the tests exercise
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed \
            ca-certificates dart-sass diffutils git jq lua imagemagick \
            nodejs python python-pip

      # The colour oracle is test-only and not in the Arch repos; the wheel
      # keeps the job from needing a compiler.
      - name: Install the colour oracle
        run: |
          python -m pip install --break-system-packages --no-cache-dir \
            materialyoucolor==3.0.4

      - uses: actions/checkout@v7.0.1

      - name: Run every contract test
        run: tests/all.sh

  lint:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: archlinux:latest
    steps:
      - name: Install the lint toolchain
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed \
            ca-certificates git lua luacheck ruff shellcheck yamllint

      - uses: actions/checkout@v7.0.1

      - name: Run static checks
        run: bash tools/lint.sh

  build:
    name: shell build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    steps:
      - name: Install the build dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed \
            base-devel cmake git meson ninja python pkgconf \
            qt6-base qt6-declarative qt6-shadertools \
            alsa-lib fftw iniparser libglvnd libpipewire libpulse \
            lm_sensors ncurses portaudio sdl2 sndio aubio libqalculate pam

      # libcava is AUR-only. Build the upstream 1.0.0 tag directly so the
      # plugin's Cava dependency is available without an AUR helper.
      - name: Build and install libcava
        run: |
          git clone --depth 1 --branch 1.0.0 \
            https://github.com/LukashonakV/cava.git /tmp/libcava
          meson setup /tmp/libcava/build /tmp/libcava \
            -Dcava_font=false --prefix=/usr
          ninja -C /tmp/libcava/build
          ninja -C /tmp/libcava/build install

      - uses: actions/checkout@v7.0.1

      - name: Configure and build the shell
        run: tools/build.sh
