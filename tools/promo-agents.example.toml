# Copy to ~/.config/padilha/agents.toml and adjust.
#
# One repository is selected per scheduler tick; only one agent runs at a time.
# The next repository starts after the current agent exits.
# The windows below are examples, not a claim about DeepSeek's current
# schedule. Verify the current off-peak/discount hours and put them here.

[schedule]
timezone = "America/Sao_Paulo"
# Stop 30 minutes before the window closes: no launch after this point, and a
# running agent is terminated at it, so nothing bills outside the discount.
stop_margin_minutes = 30
# SIGTERM at the margin, then SIGKILL after this many seconds.
stop_grace_seconds = 20

[[schedule.windows]]
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
start = "16:30"
end = "00:30"

[agent]
command = ["dsh", "--profile", "headless"]

[maintenance]
# Opt-in. With this false, an empty queue means the window idles: the
# coordinator decides what is worth doing. Enable it only when you want a repo
# to review itself after its queue drains.
enabled = false
# 0 keeps doing maintenance rounds until the stop margin. A positive number caps
# the rounds per window.
max_rounds_per_window = 0
# Minimum gap between rounds, so a fast failure cannot spin.
min_round_seconds = 900

# Repository ids key the queue entries; adjust the paths to your checkouts.
[repos."padilha-de"]
path = "~/Códigos/lilith/lilith-de"
queue = "~/.config/padilha/agents/queue/padilha-de"
tests = ["bash", "tests/all.sh"]
push = false

[repos."padilha-dotfiles"]
path = "~/Códigos/lilith/lilith-dotfiles"
queue = "~/.config/padilha/agents/queue/padilha-dotfiles"
tests = ["bash", "-c", "for f in $(git ls-files '*.lua'); do luac -p \"$f\" || exit 1; done"]
push = false

