# Midnight Commander skin, generated by padilha-theme from the current scheme.
# Do not edit: change share/templates/mc-skin.ini and run padilha-theme apply.

[skin]
    description = Padilha
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

{{ $aliases }}
[core]
    _default_ = #f9e0d9;#130d0a
    selected = #ffdcd1;#764636
    marked = #f9b7a2;;bold
    markselect = #f9b7a2;#764636;bold
    gauge = #603425;#f9b7a2
    input = #f9e0d9;#221714
    inputunchanged = #84716b;#221714
    inputmark = #603425;#f9b7a2
    disabled = #84716b;#291d19
    reverse = #603425;#f9b7a2
    commandlinemark = #603425;#f9b7a2
    header = #bca6a0
    shadow = #000000;#000000

[dialog]
    _default_ = #f9e0d9;#291d19
    dfocus = #603425;#f9b7a2
    dhotnormal = ;;underline
    dhotfocus = #603425;#f9b7a2;underline
    dtitle = ;;bold

[error]
    _default_ = #490006;#fa746f
    errdfocus = #490006;#c54d4a
    errdhotnormal = ;;underline
    errdhotfocus = #490006;#c54d4a;underline
    errdtitle = ;;bold

[filehighlight]
    directory = #ffa2bd
    executable = #b5ccba
    symlink = #ffaaa8
    hardlink =
    stalelink = #ff9883
    device = #ffeee6
    special = #ffbfa7
    core = #faab99
    temp = #534641
    archive = #e1df87
    doc = #ffbbc0
    source = #ffdb94
    media = #f2b2f2
    graph = #ffd3cd
    database = #ffbfa7

[menu]
    _default_ = #f9e0d9;#221714
    menusel = #603425;#f9b7a2
    menuhot = ;;underline
    menuhotsel = #603425;#f9b7a2;underline
    menuinactive = ;#291d19

[popupmenu]
    _default_ = #f9e0d9;#221714
    menusel = #603425;#f9b7a2
    menutitle = ;;bold

[buttonbar]
    hotkey = #603425;#f9b7a2
    button = #bca6a0;#30231e

[statusbar]
    _default_ = #bca6a0;#291d19

[help]
    _default_ = #f9e0d9;#221714
    helpbold = #f9b7a2;;bold
    helpitalic = #ffecca;;italic
    helplink = #ffa2bd;;underline
    helpslink = #221714;#ffa2bd

[editor]
    editbold = #f9b7a2;;bold
    editmarked = #ffdcd1;#764636
    editwhitespace = ;#55443f
    editnonprintable = ;#000000
    editlinestate = #130d0a;#84716b
    bookmark = #603425;#f9b7a2
    bookmarkfound = #603425;#ffecca
    editrightmargin = ;#55443f
    editbg = ;#000000
    editframe = #84716b
    editframeactive = #f9b7a2
    editframedrag = #e7bdb0

[viewer]
    viewbold = #f9b7a2;;bold
    viewunderline = #ffa2bd;;underline
    viewselected = #ffdcd1;#764636

[diffviewer]
    added = #130d0a;#b5ccba
    changedline = #130d0a;#ffecca
    changednew = #130d0a;#b5ccba
    changed = #130d0a;#fa746f
    removed = #130d0a;#fa746f
    error = #490006;#fa746f

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
