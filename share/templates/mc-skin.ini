# Midnight Commander skin, generated by padilha-theme from the current scheme.
# Do not edit: change share/templates/mc-skin.ini and run padilha-theme apply.

[skin]
    description = Maria Padilha
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

{{ $aliases }}
[core]
    _default_ = MainFg;Main
    selected = SelectedFg;Selected
    marked = MarkedFg;;bold
    markselect = MarkedFg;Selected;bold
    gauge = MainFg;Selected
    input = MainFg;Input
    inputunchanged = PaleFg;Input
    inputmark = SelectedFg;Selected
    disabled = PaleFg;Dialog
    reverse = SelectedFg;Selected
    commandlinemark = SelectedFg;Selected
    header = HeaderFg
    shadow = ShadowFg;ShadowBg

[dialog]
    _default_ = DialogFg;Dialog
    dfocus = DialogFocusFg;DialogFocus
    dhotnormal = ;;underline
    dhotfocus = DialogFocusFg;DialogFocus;underline
    dtitle = ;;bold

[error]
    _default_ = ErrorFg;Error
    errdfocus = ErrorFg;ErrorFocus
    errdhotnormal = ;;underline
    errdhotfocus = ErrorFg;ErrorFocus;underline
    errdtitle = ;;bold

[filehighlight]
    directory = DirFg
    executable = ExecFg
    symlink = SymlinkFg
    hardlink =
    stalelink = StaleLinkFg
    device = DeviceFg
    special = SpecialFg
    core = CoreFg
    temp = TempFg
    archive = ArchiveFg
    doc = DocFg
    source = SourceFg
    media = MediaFg
    graph = GraphFg
    database = DbFg

[menu]
    _default_ = MenuFg;Menu
    menusel = MenuSelectedFg;MenuSelected
    menuhot = ;;underline
    menuhotsel = MenuSelectedFg;MenuSelected;underline
    menuinactive = ;Dialog

[popupmenu]
    _default_ = MenuFg;Menu
    menusel = MenuSelectedFg;MenuSelected
    menutitle = ;;bold

[buttonbar]
    hotkey = BottomNumberFg;BottomNumber
    button = TopFg;Top

[statusbar]
    _default_ = BottomFg;Bottom

[help]
    _default_ = HelpFg;Help
    helpbold = HelpBoldFg;;bold
    helpitalic = HelpItalicFg;;italic
    helplink = HelpLinkFg;;underline
    helpslink = SelectedFg;Selected

[editor]
    editbold = EditorBookmark;;bold
    editmarked = SelectedFg;Selected
    editwhitespace = ;EditorWhitespace
    # EditorVoid is transparent now, so keep non-printables visible with the
    # whitespace marker instead of letting them vanish into the background.
    editnonprintable = ;EditorWhitespace
    editlinestate = MainFg;EditorLineNumber
    bookmark = SelectedFg;Selected
    bookmarkfound = SelectedFg;EditorFindAll
    editrightmargin = ;EditorWhitespace
    editbg = ;EditorVoid
    editframe = EditorFrameFg
    editframeactive = EditorFrameActiveFg
    editframedrag = EditorFrameDragFg

[viewer]
    viewbold = ViewerBoldFg;;bold
    viewunderline = ViewerUnderlinedFg;;underline
    viewselected = SelectedFg;Selected

[diffviewer]
    added = DiffAddFg;DiffAdd
    changedline = DiffChangedFg;DiffChangedLine
    changednew = DiffAddFg;DiffAdd
    changed = DiffGapFg;DiffGap
    removed = DiffGapFg;DiffGap
    error = ErrorFg;Error

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
