[caelestia]
; Optional: this file only takes effect with the user's Spotify client and a
; separately installed Spicetify. Maria Padilha never installs or bundles
; Spotify. Point Spicetify at this theme after `padilha-theme apply`:
;   spicetify config current_theme caelestia color_scheme caelestia
;   spicetify apply
text                = {{ $onSurface }}                  ; Main text colour
subtext             = {{ $onSurfaceVariant }}           ; Subtext colour
main                = {{ $surface }}                    ; Main field background
highlight           = {{ $primaryContainer }}           ; Hover background; text stays readable on it
misc                = {{ $onSurfaceVariant }}           ; Miscellaneous text
notification        = {{ $surfaceContainerHigh }}       ; Notification toast
notification-error  = {{ $errorContainer }}             ; Error toast; text pairs with onSurface
shadow              = {{ $shadow }}                     ; Shadow for covers, context menu, also affects playlist/artist banners
card                = {{ $surfaceContainer }}           ; Context menu and tooltips
player              = {{ $secondaryContainer }}         ; Player and top-result background
sidebar             = {{ $surfaceContainer }}           ; Sidebar background
main-elevated       = {{ $surfaceContainerHigh }}       ; Higher layers than main, e.g. search bar
highlight-elevated  = {{ $surfaceContainerHighest }}    ; Home button and search bar accelerator
selected-row        = {{ $onSurface }}                  ; Selected song, scrollbar and caption text
equalizer           = {{ $secondary }}                  ; Equalizer bars
button              = {{ $primary }}                    ; Playlist/play button accent
button-active       = {{ $primary }}                    ; Active play button accent
button-disabled     = {{ $outline }}                    ; Seekbar and volume bar background
tab-active          = {{ $surfaceContainer }}           ; Tabbar active item background
accent              = {{ $primary }}                    ; Accent used by newer Spicetify builds
