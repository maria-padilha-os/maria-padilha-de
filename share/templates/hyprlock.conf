# Maria Padilha hyprlock theme, generated by padilha-theme.
# Do not edit: change share/templates/hyprlock.conf and run padilha-theme apply.

background {
    monitor =
    path = screenshot
    blur_passes = 2
    color = rgba({{ $surface }}ee)
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.18
    dots_spacing = 0.3
    outer_color = rgba({{ $primary }}ff)
    inner_color = rgba({{ $surfaceContainer }}ee)
    font_color = rgba({{ $onSurface }}ff)
    placeholder_text = <span foreground="#{{ $onSurfaceVariant }}">Password</span>
}

label {
    monitor =
    text = $TIME
    color = rgba({{ $onSurface }}ff)
    font_size = 64
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $DATE
    color = rgba({{ $onSurfaceVariant }}ff)
    font_size = 18
    position = 0, 60
    halign = center
    valign = center
}
