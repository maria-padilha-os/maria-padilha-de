font=JetBrains Mono NF:size=17
terminal=wezterm start --
prompt="> "
layer=overlay
lines=15
width=60
dpi-aware=no
inner-pad=10
horizontal-pad=40
vertical-pad=15
match-counter=yes

[border]
radius=10
width=2

[colors]
# Opaque colours keep the launcher readable over any wallpaper; fuzzel blends
# translucent values with whatever window is behind it.
background={{ $surface }}ff
text={{ $onSurface }}ff
prompt={{ $primary }}ff
placeholder={{ $outline }}ff
input={{ $onSurface }}ff
match={{ $tertiary }}ff
selection={{ $primaryContainer }}ff
selection-text={{ $onPrimaryContainer }}ff
selection-match={{ $tertiary }}ff
counter={{ $outline }}ff
border={{ $outline }}ff
